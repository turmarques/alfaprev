# netlify.toml — Configuração de deploy e headers de segurança para Netlify
# Se usar outra hospedagem, veja as equivalências em AUDITORIA-SEGURANCA-SEO.md

[build]
  publish = "."       # pasta raiz (todos os arquivos ficam na raiz)

[[headers]]
  for = "/*"
  [headers.values]

    # Impede que o navegador "adivinhe" o tipo de arquivo (evita ataques via upload de conteúdo)
    X-Content-Type-Options = "nosniff"

    # Impede que o site seja embutido em iframes por terceiros (proteção contra clickjacking)
    X-Frame-Options = "SAMEORIGIN"

    # Força uso de HTTPS por 1 ano (max-age=31536000) após primeiro acesso seguro
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Limita quais referências são enviadas ao navegar para outros sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Desativa recursos não utilizados e restringe origens de conteúdo
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com; connect-src 'self' https://api.web3forms.com https://www.google-analytics.com https://*.supabase.co; frame-src https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com;"

    # Controla acesso a recursos do dispositivo (câmera, microfone, geolocalização)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Cache otimizado para assets estáticos (logo, ícones)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache para CSS e JS (mais curto para permitir atualizações)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

