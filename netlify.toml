# netlify.toml — Configuração de deploy e headers de segurança para Netlify
# Se usar outra hospedagem, veja as equivalências em AUDITORIA-SEGURANCA-SEO.md

[build]
  publish = "."       # pasta raiz (todos os arquivos ficam na raiz)

[[headers]]
  for = "/*"
  [headers.values]

    # Impede que o navegador "adivinhe" o tipo de arquivo (evita ataques via upload de conteúdo)
    X-Content-Type-Options = "nosniff"

    # Impede que o site seja embutido em iframes por terceiros (proteção contra clickjacking)
    X-Frame-Options = "SAMEORIGIN"

    # HSTS escalonado (auditoria de segurança, out/2026): começar com duração curta e
    # sem includeSubDomains/preload até o HTTPS estar confirmado funcionando em produção
    # de forma estável (preload é quase irreversível — fica num repositório de navegadores
    # por meses mesmo após remover o header). Aumentar gradualmente depois. Mesma política
    # aplicada ao modelo Apache em publicacao/modelos/.htaccess.
    Strict-Transport-Security = "max-age=21600"

    # Impede que o navegador exponha esta janela a "window.opener" de outra origem
    # (mitiga certas classes de ataque tab-napping/XS-Leaks). Não afeta os links do
    # WhatsApp/Maps, que já usam rel="noopener" ou são embutidos via frame-src.
    Cross-Origin-Opener-Policy = "same-origin"

    # Limita quais referências são enviadas ao navegar para outros sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Desativa recursos não utilizados e restringe origens de conteúdo
    # Sem Google Analytics/Tag Manager (o site não usa nenhum script de terceiros para métricas —
    # ver assets/js/metricas.js, que só fala com o próprio Supabase do projeto).
    # Fonte Inter agora self-hosted (assets/fonts/inter-var.woff2) — sem fonts.googleapis.com/
    # fonts.gstatic.com no style-src/font-src (auditoria de segurança, out/2026).
    # frame-ancestors complementa X-Frame-Options (suportado por mais navegadores modernos).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.web3forms.com https://*.supabase.co; frame-src https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'self';"

    # Controla acesso a recursos do dispositivo (câmera, microfone, geolocalização)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Cache otimizado para assets estáticos (logo, ícones)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache para CSS e JS (mais curto para permitir atualizações)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Painel administrativo /leads.html — CSP própria e mais restrita (sem Tailwind CDN,
# sem Google Fonts em tempo de execução), sem indexação por buscadores, sem cache
# (sempre busca a versão mais recente, nunca serve dados de leads a partir de um cache
# compartilhado). Ver assets/css/leads.css, assets/js/leads/*.js e docs/DASHBOARD-LEADS.md.
[[headers]]
  for = "/leads.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none';"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Opener-Policy = "same-origin"
    Cache-Control = "no-store"

# Redirecionar www para apex ou vice-versa (descomente conforme necessário)
