<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Alfa Prev — ícone capacete">
  <defs>
    <linearGradient id="flameDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Mask para recortar o círculo central do corpo da engrenagem -->
    <!-- Círculo em espaço de tela: cx≈32, cy≈37.3, r≈7.9 (calculado a partir do transform chain) -->
    <mask id="holeDark" maskUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="white"/>
      <circle cx="32" cy="37.3" r="7.9" fill="black"/>
    </mask>
  </defs>
  <!-- Corpo do capacete/engrenagem — com buraco recortado -->
  <g transform="translate(4, 4) translate(28, 29) scale(0.72) translate(-32, -32)" mask="url(#holeDark)">
    <path d="M28 10 C28 8, 36 8, 36 10 L38 16 L26 16 Z" fill="#0F172A"/>
    <path d="M14 26 C14 15, 22 13, 32 13 C42 13, 50 15, 50 26 Z" fill="#0F172A"/>
    <rect x="10" y="25" width="44" height="4" rx="2" fill="#0F172A"/>
    <path d="M18 29 L14 36 L17 38 L16 46 L21 48 L24 53 L32 55 L40 53 L43 48 L48 46 L47 38 L50 36 L46 29 Z" fill="#0F172A"/>
  </g>
  <!-- Chama central (sem máscara — aparece sobre o buraco) -->
  <g transform="translate(4, 4) translate(28, 29) scale(0.72) translate(-32, -32)">
    <path d="M32 30 C32 30, 37 34, 37 38 C37 41, 34.5 43.5, 32 43.5 C29.5 43.5, 27 41, 27 38 C27 35.5, 28.5 34, 30 33 C30 35, 31.5 36, 32.5 36 C32.5 34.5, 32 30, 32 30 Z" fill="url(#flameDark)"/>
  </g>
</svg>
